[project]
name = "comken"
# バージョンは comken/__init__.py の __version__ が唯一の定義（2箇所更新を防ぐ）
dynamic = ["version"]
description = "業務自動化共通ライブラリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "selenium>=4.0",
    "pywin32; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "comken.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["comken*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "C4", "LOG", "G", "T20", "DTZ", "RUF"]
ignore = [
    # 日本語のコード・コメント・docstring を「紛らわしい文字」として大量に誤検知するため
    "RUF001", "RUF002", "RUF003",
    # __all__ は意味のまとまり順に並べているため、アルファベット順の強制は受け入れない
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# 管理者・利用者が結果を画面で確認する CLI ツールでは print が出力手段になる。
"rename_package.py" = ["T20"]
"comken/config.py" = ["T20"]
"examples/sample_login/run.py" = ["T20"]
