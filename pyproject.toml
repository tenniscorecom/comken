[project]
name = "comken"
# バージョンは comken/__init__.py の __version__ が唯一の定義（2箇所更新を防ぐ）
dynamic = ["version"]
description = "業務自動化共通ライブラリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "selenium>=4.0",
    "pywin32; sys_platform == 'win32'",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "comken.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["comken*"]

# py.typed（PEP 561）が無いと、インストール先の comken を型付きライブラリとして扱ってもらえず、
# エディタの補完・型チェックが弱くなる。会社では AI 補助なしで書くため補完の質が効く。
[tool.setuptools.package-data]
comken = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "C4", "C90", "LOG", "G", "T20", "DTZ", "RUF", "TID"]
ignore = [
    # 日本語のコード・コメント・docstring を「紛らわしい文字」として大量に誤検知するため
    "RUF001", "RUF002", "RUF003",
    # __all__ は意味のまとまり順に並べているため、アルファベット順の強制は受け入れない
    "RUF022",
]

[tool.ruff.lint.flake8-bugbear]
# column() は dataclasses.field() を返すので、dataclass のデフォルトに置いてよい
# （呼び出しの結果を共有してしまう「可変デフォルト」には当たらない）
extend-immutable-calls = ["comken.toolbox.master_table.column"]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import は禁止。ドットを数える作業を残さないため。
# 必ず `from comken.X import Y` のようにパッケージルートから書く（CONVENTIONS.md 参照）
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# 分岐の絡み合いの上限。**select に C90 を入れても、ここが無いと効かない**
# （2026-08-17 に、有効にしたつもりで動いていないのを見つけた）。
#
# 10 は「いま全部通る一番きつい値」。測ったら最大が 10 だったので、
# **これ以上ややこしくなった時点で落ちる**。長いだけの関数は落とさない——
# 単調に並んでいるコードは読めるので、問題は分岐が絡むほう。
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# 管理者・利用者が結果を画面で確認する CLI ツールでは print が出力手段になる。
"comken/__main__.py" = ["T20"]
"comken/core/config/cli.py" = ["T20"]
"comken/core/config/check.py" = ["T20"]
"comken/toolbox/credentials/cli.py" = ["T20"]
"comken/toolbox/salesforce/cli.py" = ["T20"]
"comken/services/salesforce_downloader/cli.py" = ["T20"]
"comken/tools/new_project.py" = ["T20"]
"examples/sample_login/run.py" = ["T20"]
# examples/ は comken を使う側のサンプルコードで、内部が独自の小さなパッケージ
# 構成（例: examples/sample_login/）を持つ。comken 本体の規約で縛ると
# 「サンプルを comken パッケージとして動かす」前提を押し付けることになるため、
# ここでは TID（相対 import 禁止）のみ外す。comken 本体側の規約は引き続き適用する。
"examples/**/*.py" = ["TID"]

[tool.pytest.ini_options]
# tools/ のスクリプト（export_for_chat など）をテストから import できるようにする。
# 直下に置くとリポジトリのルートが散らかるので tools/ へ移し、その分をここで補う
pythonpath = ["tools"]

[tool.pyright]
# comken/toolbox/rpa.py は社内 RPA 基盤の import が `example_libs.v0000` という
# 公開用の仮名のため、pyright が解決できない。設定で除外する。
# 会社 PC では --skip-worktree で実名に書き換えて動くため、ここで除外しても
# 機能には影響しない (このファイルは実機確認でも import しない)。
exclude = ["comken/toolbox/rpa.py"]

# __init__.py が `__getattr__` (PEP 562) で遅延公開している属性は
# pyright の static analysis からは見つからず、`__all__` に書いた名前が
# "モジュールに存在しない" と reportUnsupportedDunderAll で警告される。
# 動的 import の設計 (comken.services.salesforce_downloader が代表)
# 自体は正しいため、警告を抑制する。`__all__` 自体は M3 が触る箇所なので
# 整合性はテスト (tests/test_docs_code.py など) で別途担保する。
reportUnsupportedDunderAll = false
