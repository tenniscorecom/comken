name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # comken は Windows 専用機能（pywin32・COM）を含むため Windows ランナーで検証する
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pandas は任意の依存だが、Table.to_dataframe / from_dataframe のテストを
          # CI でも動かすために入れる（無いときのエラーはテスト内で再現している）
          pip install -e .[pandas]
          # ruff / pytest / pyright はバージョンを固定する。未固定だと CI に最新版が入り、
          # 手元と formatter の挙動がずれて「ローカルは通るのに CI だけ落ちる」
          # 状態になる（実際 0.15 と 0.16 の差で 12 ファイルが不一致になった）。
          # 上げるときは手元でも同じ版に上げ、ruff format をかけ直してから変更する。
          pip install pytest==9.1.1 ruff==0.15.21 pyright==1.1.411

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Tests
        run: python -m pytest tests -q
